name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run test-credentials.sh
        run: bash tests/test-credentials.sh

      # test-gh-token-permissions.sh is intentionally excluded: it's a
      # human-in-the-loop integration test that must run from inside a live
      # claude-wrapper session against a real sandbox repo with a live
      # wrapper-issued GH_TOKEN. It guards on GIT_AUTHOR_NAME == "Claude
      # Code Bot" and hard-exits on a vanilla runner, and it fires live
      # mutating GitHub API requests unsuitable for unattended CI.

      - name: Run test-launch-dir-check.sh
        run: bash tests/test-launch-dir-check.sh

      - name: Run test-remote-session.sh
        run: bash tests/test-remote-session.sh

      - name: Run test-wrapper.sh
        run: bash tests/test-wrapper.sh

      # ubuntu-24.04's apt-packaged shellcheck (0.9.0) disagrees with the
      # 0.11.0 used in local dev (Homebrew) on SC2317 reachability analysis
      # for functions that are defined but never called within the same
      # file (e.g. helpers kept for future test authors, or invoked only
      # indirectly). Pinning a specific release here keeps CI and local
      # dev on the same shellcheck version so they always agree.
      - name: Install ShellCheck v0.11.0
        run: |
          curl -Lfso /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          expected_sha256="8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          echo "${expected_sha256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version | grep -q "version: 0.11.0"

      - name: ShellCheck
        run: |
          shopt -s nullglob
          lib_sh=(lib/*.sh)
          bin_files=(bin/claude-wrapper)
          test_sh=(tests/*.sh)
          testlib_sh=(tests/lib/*.sh)

          status=0
          for label_count in \
            "lib/*.sh:${#lib_sh[@]}" \
            "bin/claude-wrapper:${#bin_files[@]}" \
            "tests/*.sh:${#test_sh[@]}" \
            "tests/lib/*.sh:${#testlib_sh[@]}"; do
            label="${label_count%%:*}"
            count="${label_count##*:}"
            if [ "${count}" -eq 0 ]; then
              echo "::error::ShellCheck pattern '${label}' matched no files - check test-suite layout" >&2
              status=1
            fi
          done
          if [ "${status}" -ne 0 ]; then
            exit 1
          fi

          files=("${lib_sh[@]}" "${bin_files[@]}" "${test_sh[@]}" "${testlib_sh[@]}")
          echo "ShellCheck target files:"
          printf '  %s\n' "${files[@]}"
          shellcheck --external-sources "${files[@]}"
